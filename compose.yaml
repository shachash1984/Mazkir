services:
  mazkir:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - mazkir-data:/app/data
      - ./backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  mazkir-data:
